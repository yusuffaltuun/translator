[package]
name = "translator"
version = "0.1.0"
edition = "2021"

[lib]
name = "translator"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
ort = "2.0.0-rc.12"
tokenizers = "0.21"
log = "0.4"
thiserror = "2.0.19"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "translator_benches"
harness = false
