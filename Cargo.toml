[package]
name = "translator"
version = "0.1.0"
edition = "2021"

[lib]
name = "translator"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
ort = "2.0.0-rc.12"
tokenizers = "0.21"
log = "0.4"
thiserror = "2.0.19"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bench]]
name = "bench_text_handling"
harness = false

[[bench]]
name = "bench_overlap_trimmer"
harness = false

[[bench]]
name = "bench_mock_pipeline"
harness = false

[[bench]]
name = "bench_onnx_batching"
harness = false

[[bench]]
name = "bench_end_to_end"
harness = false
